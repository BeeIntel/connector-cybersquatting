version: "3"
services:
  connector-cybersquatting:
    image: connector-cybersquatting:latest
    environment:
      - OPENCTI_URL=ChangeMe
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe  
      - CONNECTOR_NAME=Cybersquatting Domain Import
      - CONNECTOR_SCOPE=Domain-Name
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_CONFIDENCE_LEVEL=75
      - CONNECTOR_LOG_LEVEL=info
      - TARGET_SUBSTRINGS=keywords_for_search
      - EXCLUDE_SUBSTRINGS=keywords_for_exclude
      - SCHEDULE_INTERVAL=interval_in_seconds
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTP_PROXY}
      - NO_PROXY=opencti,rabbitmq
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
