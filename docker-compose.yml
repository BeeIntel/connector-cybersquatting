version: "3"
services:
  connector-cybersquatting:
    image: beeintelligence/connector-cybersquatting:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe  
      - CONNECTOR_NAME=Cybersquatting Domain Import
      - CONNECTOR_SCOPE=Domain-Name
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_CONFIDENCE_LEVEL=75
      - CONNECTOR_LOG_LEVEL=info
      - TARGET_SUBSTRINGS=                            #keywords context for searching
      - EXCLUDE_SUBSTRINGS=                           #keywords for exclude
      - SCHEDULE_INTERVAL=86400                       #Interval in seconds, domain zones are updated once every 24 hours.
      - OPENCTI_TLS_REJECT_UNAUTHORIZED=true
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
